<title>Xanh24 Smart Hospital – Bệnh viện Phụ sản Trung ương</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFC; --card:#FFFFFF; --ink:#0F172A; --ink2:#334155; --muted:#64748B; --line:#E2E8F0; --soft:#F1F5F9;
  --navy:#0F2A5A; --blue:#0033A0; --sky:#00A6ED; --mint:#00D18F; --red:#E11D48; --amber:#F59E0B;
  --accent:#0033A0; --accent-soft:#E8EEFB; --accent-ink:#0F2A5A;
  --face:#DCE6F5; --face2:#C9D7EE; --roof:#FFFFFF; --ground:#EEF3F9;
  --grad:linear-gradient(90deg,#00A6ED,#00D18F);
  --shadow:0 8px 24px rgba(15,42,90,.06);
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-tenant="vmtc"]{ --accent:#2E63B8; --accent-soft:#E8EFFA; --accent-ink:#1B4585; --face:#DCE5F4; --face2:#C8D6EE; --ground:#F2F5FA; }
:root[data-tenant="pdg"]{ --accent:#1E6FA8; --accent-soft:#E6F1F9; --accent-ink:#15507A; --face:#D6E6F2; --face2:#BFD6EA; --ground:#EEF5F0; }
:root[data-tenant="sph"]{ --accent:#1D4E9E; --accent-soft:#E7EEFA; --accent-ink:#163A78; --face:#DCE4F2; --face2:#C9D5EB; --ground:#F1F4F9; }
:root[data-tenant="pshn"]{ --accent:#2E7D32; --accent-soft:#E8F5E9; --accent-ink:#1B5E20; --face:#D7ECD9; --face2:#C3E2C6; --ground:#EFF6EF; }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0B1628; --card:#12213A; --ink:#E8EEF7; --ink2:#C6D2E3; --muted:#8FA3BF; --line:#22375A; --soft:#172A47;
    --accent-soft:#1A2F55; --face:#1F3963; --face2:#1A3257; --roof:#28497C; --ground:#10203A; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark; }
  :root[data-tenant="vmtc"]:not([data-theme="light"]){ --accent:#6C9BE8; --accent-soft:#1A2F55; --accent-ink:#BCD0F5; }
  :root[data-tenant="pdg"]:not([data-theme="light"]){ --accent:#5AA8DD; --accent-soft:#16304A; --accent-ink:#B5D8F0; }
  :root[data-tenant="sph"]:not([data-theme="light"]){ --accent:#5B8DEF; --accent-soft:#1A2F55; --accent-ink:#B7CCF7; }
  :root[data-tenant="pshn"]:not([data-theme="light"]){ --accent:#4CAF50; --accent-soft:#17351D; --accent-ink:#A5D6A7; --face:#1E4526; --face2:#193B20; --roof:#2A5A33; --ground:#0F2016; }
}
:root[data-theme="dark"]{ --bg:#0B1628; --card:#12213A; --ink:#E8EEF7; --ink2:#C6D2E3; --muted:#8FA3BF; --line:#22375A; --soft:#172A47;
  --accent-soft:#1A2F55; --face:#1F3963; --face2:#1A3257; --roof:#28497C; --ground:#10203A; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,a,[data-act]{touch-action:manipulation}
.nav,.dlist,.days,.scroll-x,.svgwrap,.m-body{-webkit-overflow-scrolling:touch}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
img{max-width:100%}
.kiosk-lock body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
.kiosk-lock input,.kiosk-lock textarea{-webkit-user-select:text;user-select:text}
.logos,.plate{cursor:default}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* console (demo chrome) */
.console{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 14px;background:#0A1A36;color:#B8C7DE;font-size:12px}
.console b{color:#fff;font-weight:600}
.console .seg{display:inline-flex;background:#132a52;border-radius:999px;padding:2px}
.console .seg button{padding:4px 12px;border-radius:999px;color:#B8C7DE;font-size:12px}
.console .seg button[aria-pressed="true"]{background:#fff;color:#0F2A5A;font-weight:700}
#tsel{display:none}
.console select{background:#132a52;border:0;border-radius:999px;padding:4px 10px;color:#fff;font-size:12px}
.console .sp{flex:1}

/* header */
.hdr{background:#fff;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;gap:16px;padding:10px 20px;color:#0F172A}
.logos{display:flex;align-items:center;gap:14px;flex-shrink:0}
.logos .bv{height:52px;width:52px;object-fit:contain}
.logos .x24{height:44px;width:auto}
.logos .div{width:1px;height:40px;background:#E2E8F0}
.hdr .ttl{min-width:0}
.hdr .ttl h1{margin:0;font-size:17px;font-weight:800;color:#0F2A5A;line-height:1.25}
.hdr .ttl p{margin:0;font-size:12.5px;color:#64748B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.clock{text-align:right;line-height:1.15}
.clock .t{font-size:22px;font-weight:800;color:#0F2A5A;font-variant-numeric:tabular-nums}
.clock .d{font-size:11.5px;color:#64748B}
.ring{position:relative;width:46px;height:46px}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;font-size:12px;font-weight:700;color:#0F2A5A;font-variant-numeric:tabular-nums}
.btn-end{padding:10px 16px;border-radius:999px;border:1px solid #E2E8F0;font-weight:600;font-size:13px;color:#0F2A5A;background:#fff}

/* nav */
.nav{display:flex;gap:10px;padding:12px 20px;overflow-x:auto;background:var(--bg)}
.pill{flex-shrink:0;display:flex;align-items:center;gap:10px;min-height:56px;padding:0 22px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:15px;color:var(--ink2)}
.pill .ic{font-size:20px}
.pill[aria-current="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-tenant="pshn"] .pill[aria-current="true"]{background:var(--accent);border-color:var(--accent)}
.pill small{display:block;font-weight:500;font-size:11.5px;opacity:.7;line-height:1.1}

main{padding:4px 20px 20px}
.foot{background:#0F2A5A;color:#C5D3EA;font-size:12px;padding:14px 20px;display:flex;flex-wrap:wrap;gap:6px 24px}
.foot b{color:#fff}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.pad{padding:18px}
h2.sec{font-size:20px;margin:0 0 4px;font-weight:800;color:var(--ink)}
p.lead{margin:0 0 14px;color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;background:var(--grad);color:#fff;font-weight:800;font-size:15px;box-shadow:0 8px 20px rgba(0,166,237,.25)}
.cta:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;color:var(--ink2)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
.tag.warn{background:#FEF3C7;color:#92400E}
.tag.red{background:#FFE4E6;color:#9F1239}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
input.field,select.field,textarea.field{width:100%;min-height:52px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-md);padding:0 16px;font-size:16px}
textarea.field{padding:12px;min-height:160px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
.scroll-x{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}

/* IDLE */
.idle{position:relative;height:calc(100vh - var(--cb,0px));min-height:560px;display:grid;grid-template-rows:80% 20%;background:#0F2A5A;color:#fff;overflow:hidden}
@supports (height:100dvh){.idle{height:calc(100dvh - var(--cb,0px))}}
.stage{position:relative;overflow:hidden}
.slide{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;padding:4vw 5vw;opacity:0;transition:opacity .9s ease}
.slide.on{opacity:1}
.slide h2{font-size:clamp(30px,4.6vw,68px);line-height:1.05;margin:14px 0 14px;font-weight:800;letter-spacing:-.02em;max-width:14ch}
.slide p{font-size:clamp(15px,1.5vw,21px);max-width:38ch;opacity:.85;margin:0}
.slide .where{margin-top:22px;display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px}
.stage .bgA{position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(1200px 600px at 85% 30%,rgba(0,166,237,.35),transparent 60%),radial-gradient(900px 500px at 10% 100%,rgba(0,209,143,.25),transparent 60%)}
.stage .brand{position:absolute;top:22px;left:5vw;right:5vw;display:flex;align-items:center;gap:14px;z-index:3}
.stage .brand .plate{background:#fff;border-radius:16px;padding:8px 14px;display:flex;gap:12px;align-items:center}
.stage .brand .plate img.bv{height:44px;width:44px}
.stage .brand .plate img.x24{height:36px}
.live{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700}
.live i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#FF4D6D;box-shadow:0 0 0 0 rgba(255,77,109,.6);animation:blink 1.6s infinite}
@keyframes blink{0%{box-shadow:0 0 0 0 rgba(255,77,109,.6)}70%{box-shadow:0 0 0 10px rgba(255,77,109,0)}100%{box-shadow:0 0 0 0 rgba(255,77,109,0)}}
.bars{position:absolute;left:5vw;right:5vw;bottom:18px;display:flex;gap:8px;z-index:3}
.bars span{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
.bars span i{display:block;height:100%;width:0;background:#fff}
.bars span.on i{animation:fill var(--dur,8s) linear forwards}
.bars span.done i{width:100%}
@keyframes fill{to{width:100%}}
.visual{justify-self:center;width:min(34vw,440px);aspect-ratio:1}
.dock{background:#fff;color:#0F2A5A;display:flex;align-items:center;gap:18px;padding:0 5vw}
.touch{flex:1;min-height:76px;border-radius:999px;background:var(--grad);color:#fff;font-size:clamp(18px,2vw,26px);font-weight:800;letter-spacing:.01em;animation:pulse 2s ease-in-out infinite;box-shadow:0 12px 30px rgba(0,166,237,.35)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.quick{display:flex;gap:10px}
.quick button{min-height:76px;min-width:120px;border-radius:18px;border:1px solid #E2E8F0;background:#F8FAFC;font-weight:700;font-size:14px;color:#0F2A5A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.quick button span{font-size:22px}

/* MAP */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(340px,1fr);gap:16px;align-items:start}
.mapbox{position:relative;overflow:hidden}
.mapbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.mapbar .t{font-weight:800;font-size:15px}
.svgwrap{padding:6px 6px 0;overflow-x:auto}
.svgwrap svg{display:block;width:100%;height:auto;touch-action:manipulation}
.svgwrap.zoom svg{min-width:980px}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 16px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.bld{cursor:pointer}
.bld:hover .roof{fill:var(--accent-soft)}
.route-line{stroke:var(--red);stroke-width:4;fill:none;stroke-dasharray:10 8;stroke-linecap:round;stroke-linejoin:round;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}}
.yah{animation:yah 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes yah{0%,100%{r:8;opacity:.55}50%{r:13;opacity:.15}}
.dnode{cursor:pointer}
.panel{display:flex;flex-direction:column;min-height:0}
.search{position:relative}
.search input{padding-left:46px;font-size:17px}
.search .mag{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.5}
.dlist{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding-right:2px}
.ditem{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);width:100%}
.ditem:hover{border-color:var(--accent)}
.ditem .loc{margin-left:auto;text-align:right;flex-shrink:0;font-size:12px;color:var(--muted);line-height:1.3}
.ditem .loc b{display:block;color:var(--accent-ink);font-size:14px}
.ditem .nm{font-weight:700;font-size:14.5px;line-height:1.3}
.ditem .ds{font-size:12.5px;color:var(--muted);line-height:1.35}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.modes button{padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:700;line-height:1.2;color:var(--ink2)}
.modes button span{display:block;font-size:18px;margin-bottom:2px}
.modes button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.sum div{background:var(--soft);border-radius:12px;padding:10px 12px}
.sum b{display:block;font-size:20px;font-weight:800;color:var(--ink)}
.sum span{font-size:12px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;max-height:34vh;overflow:auto}
.steps li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:0}
.steps .n{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.steps li.fin .n{background:var(--red);color:#fff}
.steps .tx{font-size:14px;line-height:1.4}
.steps .dm{font-size:12px;color:var(--muted);white-space:nowrap}
.kb{display:grid;gap:6px;margin-top:10px}
.kb .r{display:flex;gap:6px;justify-content:center}
.kb button{min-width:0;flex:1;max-width:52px;height:46px;border-radius:10px;background:var(--soft);font-weight:700;font-size:15px;border:1px solid var(--line)}
.kb button.w{max-width:none;flex:3}

/* modal */
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,20,40,.55);display:grid;place-items:center;z-index:50;padding:20px}
.modal{-webkit-overflow-scrolling:touch;background:var(--card);color:var(--ink);border-radius:24px;max-width:520px;width:100%;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:calc(100vh - 40px);overflow:auto}
.modal h3{margin:0 0 6px;font-size:20px;font-weight:800}
.qrbox{background:#fff;border-radius:18px;padding:14px;display:grid;place-items:center;border:1px solid #E2E8F0;width:max-content;margin:14px auto}
.qrbox img,.qrbox canvas{display:block}
.warnbar{height:8px;background:#FFE4E6;border-radius:8px;overflow:hidden;margin:16px 0}
.warnbar i{display:block;height:100%;background:var(--red);transition:width .25s linear}

/* pay */
.paygrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.stepper{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.stepper span{font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--soft);color:var(--muted)}
.stepper span.on{background:var(--navy);color:#fff}
.stepper span.ok{background:var(--accent-soft);color:var(--accent-ink)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.keypad button{height:62px;border-radius:14px;background:var(--soft);border:1px solid var(--line);font-size:22px;font-weight:700}
.idtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.methods{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.method{padding:16px;border-radius:16px;border:1.5px solid var(--line);text-align:left;background:var(--card)}
.method b{display:block;font-size:15px}
.method span{font-size:12.5px;color:var(--muted)}
.method[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 0;border-top:2px solid var(--ink);margin-top:10px}
.total b{font-size:26px;font-weight:800}
.nfc{width:180px;height:180px;margin:10px auto;border-radius:50%;display:grid;place-items:center;font-size:54px;background:var(--accent-soft);position:relative}
.nfc::before,.nfc::after{content:"";position:absolute;top:-12px;right:-12px;bottom:-12px;left:-12px;border-radius:50%;border:3px solid var(--sky);opacity:0;animation:wave 2s infinite}
.nfc::after{animation-delay:1s}
@keyframes wave{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.25);opacity:0}}
.ok-big{width:84px;height:84px;border-radius:50%;background:var(--mint);color:#fff;display:grid;place-items:center;font-size:44px;margin:6px auto 12px}

/* booking */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.day{flex-shrink:0;width:74px;padding:10px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:center}
.day b{display:block;font-size:20px}
.day span{font-size:12px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.day[aria-pressed="true"] span{color:#C5D3EA}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slot{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.slot:disabled{background:var(--soft);color:var(--muted);text-decoration:line-through;cursor:not-allowed}
.slot[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

/* process */
.proc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pstep{position:relative;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:6px}
.pstep .no{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.pstep b{font-size:14px;line-height:1.3}
.pstep span{font-size:12.5px;color:var(--muted);line-height:1.35;flex:1}
.pstep .go{align-self:flex-start;font-size:12.5px;font-weight:700;color:var(--accent-ink);padding:6px 10px;border-radius:999px;background:var(--accent-soft)}

/* station */
.sku{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.skuc{padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px}
.skuc .em{font-size:30px}
.skuc b{font-size:14px;line-height:1.3}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:38px;height:38px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-size:18px;font-weight:700}
.lockers{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.lk{aspect-ratio:1/1.1;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.lk small{font-size:10px;font-weight:600;color:var(--muted)}
.lk.busy{background:var(--soft);color:var(--muted);cursor:not-allowed}
.lk.mine{background:var(--mint);color:#fff;border-color:var(--mint)}
.lk.mine small{color:#fff}
.lk[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}

/* mobile O2O */
.phone-wrap{display:grid;place-items:center;padding:20px;min-height:calc(100vh - var(--cb,0px))}
@supports (height:100dvh){.phone-wrap{min-height:calc(100dvh - var(--cb,0px))}.modal{max-height:calc(100dvh - 40px)}}
.phone{width:390px;max-width:100%;height:min(820px,calc(100vh - 80px));border-radius:44px;background:#0B1220;padding:10px;box-shadow:0 30px 70px rgba(0,0,0,.3)}
.phone .scr{height:100%;border-radius:36px;overflow:hidden;background:#fff;color:#0F172A;display:flex;flex-direction:column}
@media (max-width:520px){ .m-foot{position:sticky;bottom:0;z-index:5;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))} .phone-wrap{padding:0;display:block;min-height:0} .phone{width:100%;height:auto;min-height:calc(100vh - var(--cb,0px));border-radius:0;padding:0;box-shadow:none;background:none} .phone .scr{border-radius:0;min-height:calc(100vh - var(--cb,0px))} }
.m-h{background:#0F2A5A;color:#fff;padding:16px 18px 18px}
.m-h .top{display:flex;align-items:center;gap:10px}
.m-h .top img{height:34px;width:34px;background:#fff;border-radius:50%;padding:2px}
.m-h .top b{font-size:14px}
.m-h .jwt{margin-left:auto;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.m-h h3{margin:14px 0 4px;font-size:19px;line-height:1.25}
.m-h .meta{font-size:13px;opacity:.8}
.m-prog{height:6px;background:rgba(255,255,255,.2);border-radius:6px;margin-top:12px;overflow:hidden}
.m-prog i{display:block;height:100%;background:var(--grad);transition:width .4s}
.m-body{flex:1;overflow:auto;padding:14px;background:#F8FAFC;display:flex;flex-direction:column;gap:10px}
.mcard{background:#fff;border:1px solid #E2E8F0;border-radius:18px;padding:14px;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;opacity:.55}
.mcard.cur{opacity:1;border-color:#00A6ED;box-shadow:0 8px 24px rgba(0,166,237,.15)}
.mcard.done{opacity:.7}
.mcard .ill{width:72px;height:72px;border-radius:14px;background:#EEF6FD;display:grid;place-items:center}
.mcard .tx{font-size:14.5px;font-weight:600;line-height:1.35}
.mcard .sub{font-size:12px;color:#64748B;margin-top:2px}
.mcard .acts{grid-column:1/-1;display:flex;gap:8px}
.m-foot{padding:12px 14px;border-top:1px solid #E2E8F0;background:#fff;display:flex;gap:8px}
.m-foot .cta,.m-foot .ghost{flex:1;min-height:50px}
.m-foot{flex-wrap:wrap}
.m-foot .ghost.on{background:#E6F6FD;border-color:#00A6ED;color:#0F2A5A}
.m-foot .ghost.talking{box-shadow:0 0 0 3px rgba(0,166,237,.3)}
.m-foot .ghost:disabled{opacity:.55}
.vbar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:8px 10px;font-size:12.5px;color:#475569}
.vbar b{color:#0F2A5A}
.vbar .sp{flex:1}
.vbar button{padding:6px 10px;border-radius:999px;border:1px solid #E2E8F0;background:#F8FAFC;font-weight:700;font-size:12px;color:#0F2A5A}
.vbar button[aria-pressed="true"]{background:#0F2A5A;color:#fff;border-color:#0F2A5A}
.wave{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-left:8px;vertical-align:-2px;opacity:0;transition:opacity .2s}
.wave.on{opacity:1}
.wave i{width:3px;height:4px;background:#00A6ED;border-radius:2px}
.wave.on i{animation:wv .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes wv{0%,100%{height:4px}50%{height:14px}}
.p-scr{background:#F4F7FB}
.p-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid #E2E8F0}
.p-h img{height:30px;width:auto}
.p-url{flex:1;font-size:12px;color:#64748B;background:#F1F5F9;border-radius:999px;padding:5px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-me{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#00A6ED,#00D18F);color:#fff;font-weight:800}
.p-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;color:#0F172A}
.p-title{font-size:20px;margin:0;font-weight:800;color:#0F2A5A;line-height:1.25}
.p-sub{font-size:14px;margin:6px 0 0;color:#334155}
.p-card{background:#fff;border:1px solid #E2E8F0;border-radius:18px;padding:14px}
.p-card .field{background:#fff;color:#0F172A;border-color:#E2E8F0}
.p-tabs{display:grid;grid-template-columns:1fr 1fr;background:#F1F5F9;border-radius:12px;padding:3px;margin-bottom:12px}
.p-tabs button{padding:9px 6px;border-radius:10px;font-weight:700;font-size:13px;color:#475569}
.p-tabs button[aria-pressed="true"]{background:#fff;color:#0F2A5A;box-shadow:0 1px 4px rgba(15,42,90,.12)}
.p-consent{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:#475569;line-height:1.4}
.p-consent input{width:20px;height:20px;margin-top:1px;flex-shrink:0;accent-color:#00A6ED}
.p-msg{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}
.p-msg.free{background:#E8F7F0;color:#065F46}
.p-msg.soon{background:#FEF3C7;color:#92400E}
.p-msg.now{background:#FFE4E6;color:#9F1239}
.p-msg.past{background:#F1F5F9;color:#475569}
.p-ok{text-align:center}
.p-ok h3{margin:0 0 2px;font-size:18px;color:#0F2A5A}
.p-foot{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 14px;border-top:1px solid #E2E8F0;background:#fff}
.p-foot .ghost{min-height:40px;background:#fff;color:#334155;border-color:#E2E8F0}
.p-body .ghost{background:#fff;color:#334155;border-color:#E2E8F0}
.p-body .chip{background:#fff;color:#334155;border-color:#E2E8F0}
.p-body .tvc{border-color:#E2E8F0}
.tk{background:#fff;border-radius:18px;border:1px solid #E2E8F0;overflow:hidden;box-shadow:0 8px 24px rgba(15,42,90,.08)}
.tk-top{display:flex;gap:10px;align-items:center;padding:12px 14px;background:#0F2A5A;color:#fff}
.tk-top img{width:38px;height:38px;border-radius:50%;background:#fff;padding:2px;object-fit:contain}
.tk-top b{display:block;font-size:14px}
.tk-top span{font-size:11.5px;opacity:.8}
.tk-mid{display:flex;gap:12px;padding:14px;align-items:center}
.tk-q{min-width:84px;text-align:center;border-right:2px dashed #E2E8F0;padding-right:12px}
.tk-q span{display:block;font-size:11px;color:#64748B}
.tk-q b{font-size:30px;font-weight:800;color:#0F2A5A;line-height:1.1}
.tk-info{display:flex;flex-direction:column;gap:3px;font-size:13px;color:#334155;min-width:0}
.tk-info b{font-size:15px;color:#0F172A}
.tk-bot{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;background:#F8FAFC;border-top:1px solid #E2E8F0;font-size:12.5px;color:#475569}
.tk.big .tk-q b{font-size:36px}
.p-hello{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.p-row{display:flex;flex-direction:column;background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:10px 12px}
.p-feat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.p-f{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;color:#0F172A}
.p-f span{font-size:22px}
.p-f b{font-size:12px;line-height:1.2}
.p-f small{font-size:10.5px;color:#64748B}
.p-f[aria-disabled="true"]{opacity:.6}
.bk-ticket{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;text-align:left}
.bk-ticket .qrbox{margin:0}
.bk-steps{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--ink2);line-height:1.5}
@media (max-width:520px){ .p-foot{position:sticky;bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))} .bk-ticket{grid-template-columns:1fr;text-align:center} .bk-ticket .qrbox{margin:0 auto} }

.studio{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:14px;align-items:start}
.studio #stsvg{width:100%;height:auto;display:block;cursor:crosshair;max-height:72vh}
.st-side{display:flex;flex-direction:column;gap:12px}
.st-h{margin:0 0 8px;font-size:15px;font-weight:800}
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.st-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.st-grid .field{min-height:40px;font-size:14px;padding:0 10px}
.st-tool{padding:7px 11px;font-size:12.5px}
.st-issues{margin-top:10px;max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.st-issues button{text-align:left;font-size:12.5px;padding:6px 8px;border-radius:8px;background:var(--soft)}
.st-issues button.err{background:#FFE4E6;color:#9F1239}
.st-issues button.warn{background:#FEF3C7;color:#92400E}
@media (max-width:1080px){.studio{grid-template-columns:1fr}}

.pl-stage{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden}
.pl-layer{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;transition:opacity .6s ease}
.pl-layer.in{opacity:1}.pl-layer.out{opacity:0}
.pl-layer .slide{opacity:1}
.pl-media{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;background:#000}
.pl-ad{position:absolute;top:0;right:0;bottom:0;left:0}
.pl-adlabel{position:absolute;right:16px;bottom:34px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;z-index:2}
.pl-bar{position:absolute;left:5vw;right:5vw;bottom:18px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;z-index:3}
.pl-bar i{display:block;height:100%;width:0;background:#fff}
.sig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}
.sig-card{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;background:var(--card)}
.sig-card b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sig-thumb{aspect-ratio:16/9;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:32px;overflow:hidden}
.sig-thumb video,.sig-thumb img{width:100%;height:100%;object-fit:cover}
.sig-items{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:6px}
.sig-items li{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13.5px}
.sig-dur{width:64px;min-height:34px!important;padding:0 6px!important;font-size:13px!important}
.sig-in{min-height:36px!important;font-size:13px!important;padding:0 8px!important}
.sig-time{width:auto;display:inline-block}
.sig-day{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:11px;font-weight:700;margin-right:2px}
.sig-day[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.sig-ch{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.sig-share{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--soft)}
.sig-share i{display:block;height:100%}
.sig-hours{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;height:120px;align-items:end}
.sig-hours div{display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center}
.sig-hours i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.sig-hours span{font-size:9px;color:var(--muted)}
.pl-lost{position:absolute;left:5vw;bottom:34px;z-index:5;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.95);color:#0F2A5A;border-radius:14px;padding:8px 12px 8px 8px;font-size:12.5px;font-weight:700;line-height:1.3}
.pl-lost #idleQR svg{display:block}
.qr-sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.qr-tag{border:2px dashed #94A3B8;border-radius:14px;padding:14px;text-align:center;background:#fff;color:#0F2A5A;break-inside:avoid;page-break-inside:avoid}
.qr-h{font-size:12px;font-weight:700;color:#475569}.qr-t{font-size:20px;font-weight:800;margin:4px 0}.qr-n{font-size:15px;font-weight:700}.qr-s{font-size:12px;color:#64748B;margin-bottom:6px}
.qr-box{display:grid;place-items:center;margin:6px 0}.qr-c{font-size:12.5px;font-weight:600}.qr-f{font-size:10px;color:#94A3B8;margin-top:6px}
@media print{body>*:not(#layer){display:none!important}#layer .print-scrim{position:static;background:none;padding:0;display:block}#layer .print-sheet{box-shadow:none;max-height:none;overflow:visible;padding:0}.no-print{display:none!important}}
@media (orientation:portrait) and (min-width:700px){.pl-lost{bottom:40px;font-size:16px}.pl-lost #idleQR svg{width:130px;height:130px}}
.pl-sound{position:absolute;right:5vw;bottom:34px;z-index:5;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.pl-sound.warn{background:#F59E0B;color:#111}
.sig-check{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.sig-guide p{margin:4px 0 10px}
.sig-snaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:10px}
.sig-snaps figure{margin:0}.sig-snaps img{width:100%;border-radius:8px;display:block}
@media print{.console,.hdr,.nav,.foot,[data-act=sigTab],.chip,.cta{display:none!important}}

.sos-btn{position:fixed;right:18px;bottom:92px;z-index:60;background:#DC2626;color:#fff;border:0;border-radius:999px;padding:14px 22px;font-size:17px;font-weight:800;box-shadow:0 8px 24px rgba(220,38,38,.45);display:flex;align-items:center;gap:8px;min-height:60px;letter-spacing:.01em}
.sos-btn:active{transform:scale(.97)}
.sos-btn.idle{top:88px!important;bottom:auto!important;left:auto!important;right:24px!important;height:auto!important;width:auto!important}
.sos-btn::before{content:"";width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.8);animation:sosp 1.6s infinite}
@keyframes sosp{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}100%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
@media (prefers-reduced-motion:reduce){.sos-btn::before{animation:none}}
.sos-scrim{z-index:200;background:rgba(127,29,29,.55)}
.sos-modal{max-width:880px;border-top:8px solid #DC2626}
.sos-count{text-align:center;padding:10px 0}
.sos-n{font-size:96px;font-weight:800;color:#DC2626;line-height:1}
.sos-go{background:#DC2626;color:#fff;border:0;border-radius:14px;min-height:56px;padding:0 28px;font-size:18px;font-weight:800}
.sos-head{display:flex;justify-content:space-between;align-items:baseline}
.sos-head h2{margin:0;color:#B91C1C}
.sos-ok{background:#ECFDF5;color:#065F46;border-radius:12px;padding:10px 12px;font-weight:700}
.sos-bad{background:#FEF2F2;color:#991B1B;border-radius:12px;padding:10px 12px;font-weight:700}
.sos-grid{display:grid;grid-template-columns:220px 1fr;gap:16px;margin-top:10px}
.sos-call{background:#FEF2F2;border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center}
.sos-call span{font-size:13px;color:#7F1D1D;font-weight:700}
.sos-call a{font-size:28px;font-weight:800;color:#B91C1C;text-decoration:none}
.sos-call small{font-size:11px;color:#7F1D1D}
.sos-qr{background:#fff;padding:6px;border-radius:10px;margin:6px 0 2px}
.sos-conds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sos-conds button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.sos-conds button[aria-pressed="true"]{background:#DC2626;color:#fff;border-color:#DC2626}
.sos-tips{margin-top:10px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
.sos-tips ul{margin:4px 0 0;padding-left:18px;line-height:1.55}
.sosc{max-width:980px;margin:0 auto;padding:24px}
.sosc-card{border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px;background:var(--card)}
.sosc-card.new{border-color:#DC2626;background:#FEF2F2;animation:soscf 1s infinite alternate}
@keyframes soscf{from{box-shadow:0 0 0 0 rgba(220,38,38,.2)}to{box-shadow:0 0 0 8px rgba(220,38,38,.15)}}
.gpp-map{width:100%;height:auto}
.gpp-list{display:flex;flex-direction:column;gap:8px}
.gpp-item{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px}
.gpp-item.on{border-color:var(--red);box-shadow:0 0 0 2px rgba(225,29,72,.15)}
.gpp-no{width:30px;height:30px;border-radius:50%;background:#00A07A;color:#fff;font-weight:800;display:grid;place-items:center;flex:none}
@media (max-width:720px){.sos-grid{grid-template-columns:1fr}.sos-conds{grid-template-columns:repeat(2,1fr)}.sos-btn{font-size:14px;padding:10px 16px;min-height:50px}}
@media (orientation:portrait) and (min-width:700px){.sos-btn{font-size:22px;min-height:76px;padding:16px 28px}.sos-btn.idle{top:110px}}

.mcard .ghost,.m-foot .ghost{background:#fff;color:#334155;border-color:#E2E8F0}

/* admin */
.agrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:16px;align-items:start}
.slider input{accent-color:var(--accent)}
.slider{display:grid;grid-template-columns:70px 1fr 44px;gap:10px;align-items:center;font-size:13.5px;padding:6px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stats div{padding:14px;border-radius:16px;background:var(--soft)}
.stats b{display:block;font-size:26px;font-weight:800}
.stats span{font-size:12.5px;color:var(--muted)}
.tvc{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tvc:last-child{border-bottom:0}
.toggle{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle[aria-checked="true"]{background:var(--mint)}
.toggle[aria-checked="true"]::after{left:23px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0F2A5A;color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25)}

@media (max-width:1080px){
  .mapgrid,.paygrid,.agrid{grid-template-columns:1fr}
  .dlist{max-height:none}
  .steps{max-height:none}
}
@media (max-width:720px){
  .console{padding:6px 10px;gap:6px}.console>b,.console>span:last-child{display:none}
  input.field,select.field,textarea.field{font-size:16px}
  .hdr{flex-wrap:wrap;padding:10px 14px;gap:10px}
  .hdr .ttl{order:3;width:100%}
  .hdr .ttl p{white-space:normal}
  .logos .bv{height:42px;width:42px}.logos .x24{height:34px}
  .clock{display:none}
  .nav{padding:10px 14px}
  .pill{min-height:50px;padding:0 16px;font-size:14px}
  main{padding:4px 12px 16px}
  .slide{grid-template-columns:1fr;padding:90px 22px 40px;align-content:center}
  .visual{display:none}
  .dock{flex-direction:column;justify-content:center;gap:10px;padding:12px 16px}
  .touch{width:100%;min-height:60px;flex:none}
  .quick{width:100%}.quick button{flex:1;min-width:0;min-height:56px}
  .idle{grid-template-rows:1fr auto}
  .stats{grid-template-columns:repeat(2,1fr)}
  .methods{grid-template-columns:1fr}
  .modes button{font-size:11.5px}
  .sum b{font-size:16px}
}
/* Standee LCD dọc (1080×1920, 9:16) */
@media (orientation:portrait) and (min-width:700px){
  .idle{grid-template-rows:74% 26%}
  .slide{grid-template-columns:1fr;align-content:center;padding:10vh 7vw 6vh;gap:3vh}
  .slide .visual{display:block;grid-row:1;justify-self:center;width:min(52vw,600px)}
  .slide h2{font-size:clamp(48px,7.4vw,100px);max-width:16ch}
  .slide p{font-size:clamp(22px,3vw,36px)}
  .slide .where{font-size:clamp(18px,2.2vw,26px);padding:12px 20px}
  .stage .brand .plate img.bv{height:72px;width:72px}.stage .brand .plate img.x24{height:58px}
  .live{font-size:18px}
  .dock{flex-direction:column;justify-content:center;gap:2.4vh;padding:0 7vw}
  .touch{width:100%;flex:none;min-height:9.5vh;font-size:clamp(30px,4.2vw,48px)}
  .quick{width:100%}.quick button{flex:1;min-height:9vh;font-size:clamp(18px,2.4vw,26px)}.quick button span{font-size:clamp(28px,3.6vw,40px)}
  body{font-size:17px}
  .hdr .ttl h1{font-size:22px}.logos .bv{height:64px;width:64px}.logos .x24{height:52px}
  .pill{min-height:70px;font-size:18px}
  .ditem .nm{font-size:17px}.steps .tx{font-size:17px}
  .dlist{max-height:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}
}

            ")");

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}

	}

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxEcCount = Math.max(maxEcCount, ecCount);

		for (var i = 0; i < dcdata[r].length; i++) {

		for (var x = 0; x < ecdata[r].length; x++) {

		}

	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {

			}

		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

};

async function openAnchor(tok) {
    let pl;
    try {
        pl = await readToken(tok);
        if (pl.k !== "anchor")
            throw new Error("Đây không phải mã QR định vị.");
        if (CFG.lockTenant && pl.t !== CFG.lockTenant)
            throw new Error("Mã QR thuộc bệnh viện khác.");
    }
    catch (e) {
        S.mobile = { token: null, payload: null, err: e.message, idx: 0 };
        S.view = "mobile";
        render();
        return;
    }
    S.tenant = pl.t;
    const t = T();
    t._kioskCtx = pl.kid || undefined;
    G = buildGraph(t);
    const start = pl.kid ? t.kioskNode : "q_" + pl.p, here = G.N[start];
    if (!here) {
        S.mobile = { token: null, payload: null, err: "Điểm định vị này không còn trên bản đồ – vui lòng báo nhân viên.", idx: 0 };
        S.view = "mobile";
        render();
        return;
    }
    Security.audit("anchor:scan", pl.p || pl.kid);
    let trip = null;
    try {
        trip = JSON.parse(localStorage.getItem("x24trip") || "null");
    }
    catch (e) { }
    if (trip && trip.t === pl.t && Date.now() - trip.ts < 4 * 3600000 && G.N[trip.d]) {
        await startTrip(start, trip.d, trip.m, `📍 Đã cập nhật vị trí: ${here.name}${here.f ? " (tầng " + here.f + ")" : ""}. Lộ trình mới từ đây.`);

            S.portal.otpSent = null;
            render();
            return;
        case "pVerify": {
            const p = S.portal;
            const ph = normPhone(p.phone);
            if (Security.locked("otp:" + ph)) {
                toast("Số này đang tạm khóa đăng nhập");
                p.otpSent = null;
                render();
                return;
            }
            if (!p.otpAt || Date.now() - p.otpAt > 5 * 60000) {
                toast("Mã đã hết hạn – vui lòng nhận mã mới");
                p.otpSent = null;
                p.otpAt = 0;
                render();
                return;
            }
            if ((p.otp || "") !== p.otpSent) {
                const st = Security.fail("otp:" + ph, 5, 10 * 60000);
                toast(st.until > Date.now() ? "Sai quá nhiều lần – tạm khóa 10 phút" : `Mã xác thực không đúng (còn ${5 - (st.n % 5)} lần)`);
                if (st.until > Date.now()) {
                    p.otpSent = null;
                    render();
                }
                return;
            }
            Security.ok("otp:" + ph);
            Security.audit("portal:login", "");
            Acct.login(p.phone);
            p.otpSent = null;
            toast("Đăng nhập thành công");
            if (p.pl)
                saveTicketToAccount();
            else {
                p.step = "home";
                render();
            }
            return;
        }
        case "pSave":
            saveTicketToAccount();
            return;
        case "pExport": {
            const acc = Acct.current();
            if (!acc)
                return;
            const data = JSON.stringify({ exported: new Date().toISOString(), account: { id: acc.id, name: acc.name, phone: acc.phone, created: acc.created }, tickets: acc.tickets.map((k) => { const ti = ticketInfo(k.pl); return { code: k.code, hospital: ti && ti.t.name, service: ti && ti.svc.name, at: new Date(k.pl.at).toISOString(), place: ti && placeText(ti) }; }) }, null, 2);
            try {
                const u = URL.createObjectURL(new Blob([data], { type: "application/json" }));
                const a2 = document.createElement("a");
                a2.href = u;
                a2.download = `xanh24-du-lieu-${acc.id}.json`;
                document.body.appendChild(a2);
                a2.click();
                a2.remove();
                setTimeout(() => URL.revokeObjectURL(u), 1000);
                toast("Đã tải dữ liệu");
            }
            catch (e) {
                toast("Trình duyệt không cho phép tải file");
            }
            return;
        }
        case "pDelete": {
            if (!S.portal.confirmDel) {
                S.portal.confirmDel = Date.now();
                toast("Bấm “Xóa tài khoản” lần nữa trong 5 giây để xác nhận");
                return;
            }
            if (Date.now() - S.portal.confirmDel > 5000) {
                S.portal.confirmDel = Date.now();
                toast("Bấm lần nữa để xác nhận");
                return;
            }
            Acct.remove();
            Voice.stop();
            S.portal.confirmDel = 0;
            S.portal.step = "home";
            Security.audit("portal:delete", "");
            toast("Đã xóa tài khoản và toàn bộ dữ liệu trên thiết bị");
            render();
            return;
        }
        case "pLogout":
            Acct.logout();
            Voice.stop();
            S.portal.step = S.portal.pl ? "view" : "home";
            render();
            return;
        case "pHome":
            S.portal.step = "home";
            render();
            return;
        case "pOpen": {
            const acc = Acct.current(), k = acc && acc.tickets.find((x) => x.code === v);
            if (k) {
                S.portal.pl = k.pl;
                S.portal.tok = k.tok;
                S.portal.step = "view";
                render();
            }
            return;
        }
        case "pVoice": {
            const acc = Acct.current();
            if (!acc)
                return;
            acc.prefs = acc.prefs || {};
            acc.prefs.voice = acc.prefs.voice === false;
            Acct.put(acc);
            if (acc.prefs.voice)
                Voice.say("Đã bật thông báo bằng giọng nói.");
            else
                Voice.stop();
            render();
            return;
        }
        case "pNotify": {
            const r = await Notify.ask();
            toast(r === "granted" ? "Đã bật thông báo" : "Chưa được cấp quyền thông báo");
            render();
            return;
        }
        case "pSpeak": {
            const ti = ticketInfo(S.portal.pl);
            if (ti)
                Voice.say(waitMessage(ti, false).text.replace(/\.\s+/g, ".|").split("|"));
            return;
        }
        case "pSimNotify": {
            const acc = Acct.current();
            if (!acc || !acc.tickets.length) {
                toast("Chưa có phiếu khám trong tài khoản");
                return;
            }
            const k = (S.portal.pl && acc.tickets.find((x) => x.code === S.portal.pl.c)) || acc.tickets[0];
            fireTicketAlert(k);
            return;
        }
        case "pFeat": {
            const f = X24_FEATURES.find((x) => x.id === v);
            if (f && f.status !== "live")
                toast(`${f.name}: sắp ra mắt`);
            return;
        }
        case "alClose":
            Voice.stop();
            closeLayer();
            render();
            return;
        case "alRepeat": {
            const acc = Acct.current(), k = acc && acc.tickets.find((x) => x.code === v);
            if (k)
                Voice.say(notifySpeech(k, acc));
            return;
        }
        case "tkRoute": {
            const acc = Acct.current();
            const k = (acc && acc.tickets.find((x) => x.code === v)) || (S.portal.pl && S.portal.pl.c === v ? { pl: S.portal.pl } : null);
            if (!k || !k.pl.d)
                return;
            closeLayer();
            const t = TENANTS[k.pl.t];
            if (k.pl.t !== S.tenant) {
                S.tenant = k.pl.t;
                G = buildGraph(T());
            }
            const from = (t.gates && t.gates[0] && t.gates[0].id) || t.kioskNode, now = Math.floor(Date.now() / 1000);
            const tok = await makeToken({ t: k.pl.t, f: from, d: k.pl.d, m: t.defaultMode || "pregnant", k: "XANH24-VN", iat: now, exp: now + 3600 });
            S.portal.back = true;
            await openMobileWith(tok, false);
            S.mobile.fromPortal = true;
            render();
            return;
        }
        case "backPortal":
            Voice.stop();
            S.view = "portal";
            render();
            return;
        case "bookSim": {
            const tok = S.book.hold && S.book.hold.tok;
            if (tok)
                openPortalWith(tok, true);
            return;
        }
        case "bookCancel":
            S.book = { svc: null, day: 0, slot: null, hold: null };
            render();
            return;
        /* station */
        case "stTab":
            S.station.tab = v;
            render();
            return;
        case "qty": {
            const c = S.station.cart;
            c[v] = Math.max(0, Math.min(5, (c[v] || 0) + +el.dataset.d));
            if (!c[v])
                delete c[v];
            render();
            return;
        }
        case "vendPay":
            S.station.vendDone = { slot: 1 + Math.floor(Math.random() * 6), code: `V-${code4()}` };
            S.station.cart = {};
            S.stats.pays++;
            render();
            return;
        case "vendNew":
            S.station.vendDone = null;
            render();
            return;
        case "lk":
            S.station.sel = +v;
            S.station.issued = null;
            render();
            return;
        case "lkH":
            S.station.hours = +v;
            render();
            return;
        case "lkPay": {
            const st = S.station, pin = String(Math.floor(100000 + Math.random() * 900000));
            const until = new Date(Date.now() + st.hours * 3600000).toLocaleString("vi-VN", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit" });
            st.lockers[st.sel] = { pin };
            st.issued = { n: st.sel, pin, until };
            st.sel = null;
            S.stats.pays++;
            render();
            return;
        }
        case "pinkey": {
            const st = S.station;
            if (v === "⌫")
                st.pinIn = st.pinIn.slice(0, -1);
            else if (v === "Mở") {
                const n = Object.keys(st.lockers).find((k) => st.lockers[k].pin === st.pinIn);
                if (n) {
                    delete st.lockers[n];
                    st.pinIn = "";
                    st.issued = null;
                    toast(`Ngăn ${n} đã mở. Cảm ơn bạn!`);
                    render();
                }
                else
                    toast("Mã không đúng. Kiểm tra lại 6 số.");
                return;
            }
            else if (st.pinIn.length < 6)
                st.pinIn += v;
            const i = document.querySelector('[data-input="pin"]');
            if (i)
                i.value = st.pinIn;
            return;
        }
        /* admin */
        case "aTab":
            S.admin.tab = v;
            render();
            return;
        case "exp":
            S.admin.exp = v;
            render();
            return;
        case "copyJson": {
            const tx = $("#jsonout").value;
            try {
                await navigator.clipboard.writeText(tx);
                toast("Đã sao chép JSON");
            }
            catch (e) {
                $("#jsonout").select();
                toast("Nhấn Ctrl/Cmd + C để sao chép");
            }
            return;
        }
        case "resetPos":
            T()._pos = {};
            G = buildGraph(T());
            render();
            return;
        case "tvc": {
            const x = T().tvc[+v];
            x.on = !x.on;
            render();
            return;
        }
        case "previewIdle":
            S.view = "kiosk";
            S.screen = "idle";
            render();
            return;
    }
}
function onInput(k, el) {
    const key = k;
    switch (k) {
        case "q":
            S.map.q = el.value;
            $("#dlist").innerHTML = deptItems();
            return;
        case "pq":
            S.price.q = el.value;
            $("#ptable").innerHTML = priceTable(T().prices.filter((p) => !norm(el.value) || norm(p.name + " " + p.note).includes(norm(el.value))));
            return;
        case "pcode":
            S.pay.code = el.value.replace(/\D/g, "").slice(0, 10);
            el.value = S.pay.code;
            return;
        case "pphone":
            S.pay.phone = el.value;
            return;
        case "pin":
            S.station.pinIn = el.value.replace(/\D/g, "").slice(0, 6);
            el.value = S.station.pinIn;
            return;
        case "crowd": {
            const b = T().buildings.find((x) => x.id === el.dataset.b);
            b.crowd = el.value / 100;
            $("#cr_" + b.id).textContent = el.value + "%";
            G = buildGraph(T());
            $("#jsonout").value = exportJson(S.admin.exp);
            return;
        }
        case "cfgTimeout":
            S.cfg.timeout = +el.value;
            $("#cfgT").textContent = el.value + "s";
            saveCfg({ timeout: +el.value });
            return;
        case "devK":
        case "devB":
        case "devP": return;
        case "pName":
            S.portal.name = el.value;
            return;
        case "gppF": {
            const p = (T().pharmacies || [])[+el.dataset.i];
            if (!p)
                return;
            const k2 = el.dataset.k;
            if (["dist", "dir"].includes(k2)) {
                const n = parseInt(el.value, 10);
                if (n >= 0)
                    p[k2] = k2 === "dir" ? n % 360 : n;
            }
            else if (["lat", "lon"].includes(k2)) {
                const n = parseFloat(el.value);
                p[k2] = isFinite(n) ? n : undefined;
            }
            else
                p[k2] = Security.clean(el.value, k2 === "addr" ? 120 : 80);
            return;
        }
        case "locQ": {
            S.locate.q = el.value;
            const box = $("#locList");
            if (box) {
                const tmp = document.createElement("div");
                tmp.innerHTML = locateView();
                const nb = tmp.querySelector("#locList");
                if (nb)
                    box.innerHTML = nb.innerHTML;
            }
            return;
        }
        case "stQName": {
            const a = (T().anchors || []).find((x) => "q:" + x.id === ST.sel);
            if (a) {
                a.name = Security.clean(el.value, 60) || a.name;
                stRebuild();
            }
            return;
        }
        case "sigPlName": {
            const p = sig().playlists.find((x) => x.id === (S.sigPl || sig().playlists[0].id));
            if (p && sigCan("playlist"))
                p.name = Security.clean(el.value, 60) || p.name;
            return;
        }
        case "sigItemDur": {
            const p = sig().playlists.find((x) => x.id === (S.sigPl || sig().playlists[0].id));
            const n = parseInt(el.value, 10);
            if (p && sigCan("playlist") && n >= 3 && n <= 120)
                p.items[+el.dataset.i].dur = n;
            return;
        }
        case "sigSch": {
            if (!sigCan("schedule"))
                return;
            const sc = sig().schedules[+el.dataset.i], k2 = el.dataset.k;
            if (!sc)
                return;
            if (k2 === "priority") {
                const n = parseInt(el.value, 10);
                if (n >= 1 && n <= 9)
                    sc.priority = n;
            }
            else if (k2 === "name")
                sc.name = Security.clean(el.value, 50);
            else if (/^(from|to)$/.test(k2))
                sc[k2] = /^\d{4}-\d{2}-\d{2}$/.test(el.value) ? el.value : "";
            else if (/^(start|end)$/.test(k2) && /^\d{2}:\d{2}$/.test(el.value))
                sc[k2] = el.value;
            return;
        }
        case "sigDevVol": {
            if (!sigCan("device"))
                return;
            const dv = sig().devices[+el.dataset.i];
            if (!dv)
                return;
            const n = parseInt(el.value, 10);
            if (el.value === "")
                delete dv.volume;
            else if (n >= 0 && n <= 100)
                dv.volume = n;
            return;
        }
        case "sigAud": {
            if (!sigCan("device"))
                return;
            const n = parseInt(el.value, 10);
            if (n >= 0 && n <= 100) {
                sig().audio[el.dataset.k] = n;
                const o = $("#aud_" + el.dataset.k);
                if (o)
                    o.textContent = n + "%";
            }
            return;
        }
        case "sigAudT": {
            if (!sigCan("device"))
                return;
            if (/^\d{2}:\d{2}$/.test(el.value))
                sig().audio[el.dataset.k] = el.value;
            return;
        }
        case "sigPub": {
            if (S.cms.role !== "owner")
                return;
            const k2 = el.dataset.k, pub = sig().prog.pub;
            if (["screenInch", "dwell", "share"].includes(k2)) {
                const n = parseFloat(el.value);
                if (isFinite(n) && n >= 0)
                    pub[k2] = k2 === "share" ? Math.min(100, n) : n;
            }
            else if (["lat", "lon"].includes(k2)) {
                if (el.value === "" || /^-?\d{1,3}(\.\d+)?$/.test(el.value.trim()))
                    pub[k2] = el.value.trim();
            }
            else
                pub[k2] = Security.clean(el.value, 80);
            return;
        }
        case "sigDev": {
            if (!sigCan("device"))
                return;
            const dv = sig().devices[+el.dataset.i];
            if (dv)
                dv[el.dataset.k] = Security.clean(el.value, 50);
            return;
        }
        case "sigProgNum": {
            if (!sigCan("progPolicy"))
                return;
            const n = parseFloat(el.value);
            if (isFinite(n) && n >= 0)
                sig().prog[el.dataset.k] = el.dataset.k === "maxShare" ? Math.min(60, n) : n;
            return;
        }
        case "sigCh": {
            const ch = sig().prog.channels[+el.dataset.i];
            if (!ch || S.cms.role !== "owner")
                return;
            const k2 = el.dataset.k;
            if (k2 === "timeout")
                ch.timeout = Math.max(100, Math.min(3000, parseInt(el.value, 10) || 800));
            else if (k2 === "floor" || k2 === "maxDur") {
                const n = parseInt(el.value, 10);
                if (n >= 0)
                    ch[k2] = n;
            }
            else if (k2 === "endpoint" || k2 === "proxy")
                ch[k2] = /^https:\/\//.test(el.value.trim()) ? el.value.trim().slice(0, 300) : "";
            else
                ch[k2] = Security.clean(el.value, k2 === "deals" ? 300 : 60);
            return;
        }
        case "stBgX":
        case "stBgY":
        case "stBgW":
        case "stBgOp": {
            const k = bgKey(S.tenant, ST.layer), bg = ST.bg[k];
            if (!bg)
                return;
            const v2 = parseFloat(el.value);
            if (!isFinite(v2))
                return;
            if (key === "stBgX")
                bg.x = v2;
            else if (key === "stBgY")
                bg.y = v2;
            else if (key === "stBgW")
                bg.w = Math.max(1, v2);
            else
                bg.op = v2 / 100;
            BgStore.set(k, bg);
            stRender(false);
            return;
        }
        case "stW":
        case "stH":
        case "stScale":
        case "stFpx": {
            const t = T(), v2 = parseFloat(el.value);
            if (!isFinite(v2) || v2 <= 0)
                return;
            if (key === "stW")
                t.W = Math.min(2000, v2);
            else if (key === "stH")
                t.H = Math.min(2000, v2);
            else if (key === "stScale")
                t.scale = Math.max(1, Math.min(12, v2));
            else
                t.floorPx = Math.max(6, Math.min(40, v2));
            stRebuild();
            stRender(false);
            return;
        }
        case "stBName":
        case "stBFloors":
        case "stBCrowd": {
            const b = T().buildings.find((x) => "b:" + x.id === ST.sel);
            if (!b)
                return;
            if (key === "stBName")
                b.name = Security.clean(el.value, 50) || b.name;
            else if (key === "stBFloors") {
                const n = parseInt(el.value, 10);
                if (n >= 1 && n <= 60)
                    b.floors = n;
            }
            else
                b.crowd = el.value / 100;
            stRebuild();
            stRender(false);
            return;
        }
        case "stDName":
        case "stDFloor":
        case "stDDesc": {
            const d = T().depts.find((x) => "d:" + x[0] === ST.sel);
            if (!d)
                return;
            if (key === "stDName")
                d[1] = Security.clean(el.value, 90) || d[1];
            else if (key === "stDDesc")
                d[7] = Security.clean(el.value, 120);
            else {
                const n = parseInt(el.value, 10), b = T().buildings.find((x) => x.id === d[2]);
                if (n >= 1 && b && n <= b.floors) {
                    d[3] = n;
                    ST.floor = n;
                }
            }
            stRebuild();
            stRender(false);
            return;
        }
        case "stGName": {
            const g = (T().gates || []).find((x) => "g:" + x.id === ST.sel);
            if (g) {
                g.name = Security.clean(el.value, 40) || g.name;
                stRebuild();
                stRender(false);
            }
            return;
        }
        case "stFLabel": {
            const f = T().features[+(ST.sel || "").split(":")[1]];
            if (f) {
                f.label = Security.clean(el.value, 40);
                stRender(false);
            }
            return;
        }
        case "pPhone":
            S.portal.phone = el.value;
            return;
        case "pOtp":
            S.portal.otp = el.value.replace(/\D/g, "").slice(0, 6);
            el.value = S.portal.otp;
            return;
        case "pAgree":
            S.portal.agree = !!el.checked;
            return;
        case "cfgWarn":
            S.cfg.warn = +el.value;
            $("#cfgW").textContent = el.value + "s";
            return;
    }
}
async function studioChange(c, el) {
    const t = T();
    if (c === "stLayer") {
        ST.layer = el.value;
        const m = /:(\d+)$/.exec(el.value);
        if (m)
            ST.floor = +m[1];
        render();
        return;
    }
    if (c === "stBgFile") {
        const file = el.files && el.files[0];
        if (!file)
            return;
        try {
            const r = await readImageFile(file);
            const k = bgKey(t.id, ST.layer);
            const bg = { url: r.url, ar: r.ar, x: 0, y: 0, w: t.W, op: .55 };
            ST.bg[k] = bg;
            await BgStore.set(k, bg);
            ST.showBg = true;
            ST.msg = "Đã tải ảnh. Dùng “Đặt tỷ lệ” để khớp kích thước thật.";
            Security.audit("map:bg", ST.layer);
            render();
        }
        catch (e) {
            toast(e.message);
        }
        return;
    }
    if (c === "stImport") {
        const file = el.files && el.files[0];
        if (!file)
            return;
        if (file.size > 3 * 1024 * 1024) {
            toast("File quá lớn");
            return;
        }
        try {
            const raw = JSON.parse(await file.text());
            if (raw.format && raw.format !== "xanh24-map")
                throw new Error("Không phải file bản đồ Xanh24");
            if (raw.tenant && raw.tenant !== t.id && !confirm(`File là bản đồ của "${raw.hospital || raw.tenant}". Vẫn nhập vào ${t.name}?`))
                return;
            const m = sanitizeMap(raw);
            if (!m.buildings.length)
                throw new Error("File không có tòa nhà nào");
            stPush();
            applyMap(t, m);
            stRebuild();
            S.admin.issues = validateMap(t);
            Security.audit("map:import", t.code);
            toast("Đã nhập bản đồ – bấm Lưu để giữ lại");
            render();
        }
        catch (e) {
            toast("Nhập thất bại: " + e.message);
        }
        return;
    }
    if (c === "stBOn") {
        const b = t.buildings.find((x) => "b:" + x.id === ST.sel);
        if (b) {
            stPush();
            if (el.value)
                b.on = el.value;
            else
                delete b.on;
            stRebuild();
            render();
        }
        return;
    }
    if (c === "stDType") {
        const d = t.depts.find((x) => "d:" + x[0] === ST.sel);
        if (d && TYPES[el.value]) {
            d[6] = el.value;
            stRebuild();
            stRender(false);
        }
        return;
    }
    if (c === "stFType") {
        const f = t.features[+(ST.sel || "").split(":")[1]];
        if (f) {
            f.type = el.value;
            stRender(false);
        }
        return;
    }
    if (c === "stVerified") {
        t.layoutVerified = !!el.checked;
        return;
    }
}
async function sigChange(c, el) {
    const d = sig();
    if (c === "sigUpload") {
        if (!sigCan("upload"))
            return;
        const files = [...(el.files || [])];
        let n = 0;
        for (const f of files) {
            if (!/^(video\/(mp4|webm)|image\/(jpeg|png|webp))$/.test(f.type)) {
                toast(`${f.name}: định dạng không hỗ trợ`);
                continue;
            }
            if (f.size > 200 * 1048576) {
                toast(`${f.name}: vượt 200 MB`);
                continue;
            }
            const meta = await probeMedia(f);
            if (meta.bad) {
                toast(`${f.name}: file hỏng hoặc trình duyệt không phát được`);
                continue;
            }
            const id = "m_" + Security.rand(4);
            if (!(await SigDB.set("media", id, f))) {
                toast("Không lưu được file (bộ nhớ trình duyệt đầy)");
                break;
            }
            d.media.push({ id, name: Security.clean(f.name.replace(/\.[^.]+$/, ""), 80), type: f.type.startsWith("video") ? "video" : "image", mime: f.type, size: f.size, dur: meta.dur, w: meta.w, h: meta.h, orient: meta.w >= meta.h ? "landscape" : "portrait", status: sigCan("approve") ? "approved" : "pending", by: S.cms.name, uploadedAt: Date.now(), expires: null });
            n++;
        }
        if (n) {
            sigSave("upload");
            toast(`Đã tải lên ${n} file${sigCan("approve") ? "" : " – chờ duyệt"}`);
        }
        render();
        return;
    }
    if (c === "sigSchSel") {
        if (!sigCan("schedule"))
            return;
        const sc = d.schedules[+el.dataset.i];
        if (el.dataset.k === "devices")
            sc.devices = [el.value];
        else
            sc.playlist = el.value;
        return;
    }
    if (c === "sigDevSel") {
        if (!sigCan("device"))
            return;
        const dv = d.devices[+el.dataset.i];
        if (dv && ["type", "orient"].includes(el.dataset.k))
            dv[el.dataset.k] = el.value;
        return;
    }
    if (c === "sigSnapEvery") {
        if (!sigCan("device"))
            return;
        d.snapEvery = +el.value || 0;
        sigSave("snap-every");
        return;
    }
    if (c === "sigProgSel") {
        if (!sigCan("progPolicy"))
            return;
        if (["both", "gaps", "slots"].includes(el.value))
            d.prog.fillMode = el.value;
        return;
    }
    if (c === "sigProgChk") {
        if (!sigCan("progPolicy"))
            return;
        d.prog.requireApproval = !!el.checked;
        return;
    }
    if (c === "sigPubSel") {
        if (S.cms.role !== "owner")
            return;
        d.prog.pub[el.dataset.k] = Security.clean(el.value, 40);
        return;
    }
    if (c === "sigChChk") {
        if (S.cms.role !== "owner")
            return;
        const ch = d.prog.channels[+el.dataset.i];
        if (ch)
            ch[el.dataset.k] = !!el.checked;
        return;
    }
}
/* drag in editor */
function bindDrag() {
    const svg = $("#mapsvg");
    if (!svg)
        return;
    let drag = null;
    const toSvg = (e) => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
    svg.addEventListener("pointerdown", (e) => {
        const id = e.target.dataset && e.target.dataset.drag;
        if (!id)
            return;
        drag = { id, el: e.target };
        e.target.setPointerCapture(e.pointerId);
        e.preventDefault();
    });
    svg.addEventListener("pointermove", (e) => {
        if (!drag)
            return;
        const p = toSvg(e);
        const n = G.N[drag.id];
        const bb = T()._g[n.b].bb;
        let [x, y] = unproj(p.x, p.y + 2, n.f);
        x = Math.max(bb.x + 1, Math.min(bb.x + bb.w - 1, x));
        y = Math.max(bb.y + 1, Math.min(bb.y + bb.h - 1, y));
        n.x = x;
        n.y = y;
        const q = proj(x, y, n.f, 2);
        drag.el.setAttribute("cx", q[0]);
        drag.el.setAttribute("cy", q[1]);
        const lbl = drag.el.nextElementSibling;
        if (lbl && lbl.tagName === "text") {
            lbl.setAttribute("x", q[0] + 7);
            lbl.setAttribute("y", q[1] + 3);
        }
    });
    svg.addEventListener("pointerup", () => {
        if (!drag)
            return;
        const n = G.N[drag.id], t = T();
        t._pos = t._pos || {};
        t._pos[drag.id] = { x: n.x, y: n.y };
        drag = null;
        G = buildGraph(t);
        const j = $("#jsonout");
        if (j)
            j.value = exportJson(S.admin.exp);
    });
}

document.addEventListener("click", (e) => {

});
document.addEventListener("input", (e) => { const k = e.target.dataset && e.target.dataset.input; if (k)

});
document.addEventListener("keydown", (e) => {

});
let lastMove = 0;
["pointerdown", "keydown", "input", "wheel", "touchstart"].forEach((ev) => document.addEventListener(ev, () => { if (!S.warn)
    S.lastAct = Date.now(); }, { passive: true }));
document.addEventListener("pointermove", () => { const n = Date.now(); if (n - lastMove > 500 && !S.warn) {
    S.lastAct = n;
    lastMove = n;
} }, { passive: true });
/* ---------------- TICK ---------------- */
function tick() {
    const now = new Date();
    const hm = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
    const c = $("#clk");
    if (c)
        c.textContent = hm;
    const ci = $("#clkI");
    if (ci)
        ci.textContent = hm;
    const d = $("#dte");
    if (d)
        d.textContent = now.toLocaleDateString("vi-VN", { weekday: "long", day: "2-digit", month: "2-digit" });
    if (S.sos)
        S.lastAct = Date.now();
    if (S.view === "kiosk" && S.screen === "active") {
        const idle = (Date.now() - S.lastAct) / 1000, left = Math.max(0, S.cfg.timeout - idle);
        const rc = $("#ringc"), rt = $("#ringt");
        if (rc) {
            rc.setAttribute("stroke-dashoffset", (119.4 * (1 - left / S.cfg.timeout)).toFixed(1));
            rc.setAttribute("stroke", left < 10 ? "#E11D48" : "#00A6ED");
        }
        if (rt)
            rt.textContent = Math.ceil(left);
        if (idle >= S.cfg.timeout && !S.warn) {
            S.warn = true;
            showWarn();
        }
        if (S.warn) {
            const wl = Math.max(0, S.cfg.timeout + S.cfg.warn - idle);
            const w = $("#warnleft"), wb = $("#warnbar");
            if (w)
                w.textContent = Math.ceil(wl);
            if (wb)
                wb.style.width = (wl / S.cfg.warn * 100) + "%";
            if (wl <= 0) {
                resetSession(true);
                render();
            }
        }
    }
    if (S.view === "admin" && !S.showConsole && (Date.now() - S.lastAct) / 1000 > 120) {
        S.adminUnlocked = false;
        S.view = "kiosk";
        resetSession(true);
        render();
        toast("Đã thoát quản trị do không thao tác");
    }
    portalTick();
    if (S.qrModal) {
        const l = $("#qrleft");
        if (l)
            l.textContent = mmss(S.qrModal.exp - Date.now() / 1000);
    }
    if (S.view === "mobile" && S.mobile.payload) {
        const l = S.mobile.payload.exp - Date.now() / 1000, j = $("#jwtleft");
        if (j)
            j.textContent = "JWT " + mmss(l);
        if (l <= 0) {
            Voice.stop();
            S.mobile = { token: null, payload: null, err: "Mã QR đã hết hạn (15 phút). Hãy quét lại tại kiosk.", idx: 0 };
            render();
        }
    }
    const pe = $("#payexp");
    if (pe && S.pay.payStart)
        pe.textContent = mmss(300 - (Date.now() - S.pay.payStart) / 1000);
    const hl = $("#holdleft");
    if (hl && S.book.hold) {
        const s = (S.book.hold.until - Date.now()) / 1000;
        hl.textContent = mmss(s);
        if (s <= 0) {
            S.book.hold = null;
            toast("Giữ chỗ đã hết hạn");
            render();
        }
    }
}
setInterval(tick, 250);
/* Tải lại trang mỗi ngày lúc 04:00 khi chạy trên màn hình kiosk/standee (giải phóng bộ nhớ WebView) */

/* Nhà thuốc mặc định: nhà thuốc trong bệnh viện (từ danh sách khoa) + ví dụ mẫu bên ngoài – cần cập nhật danh sách thật */
function defaultPharmacies(t) {
    const inH = t.depts.filter((d) => /thuoc|pharm/i.test(d[0]) || /^Nhà thuốc/i.test(d[1])).map((d) => ({ name: d[1], addr: `${(t.buildings.find((b) => b.id === d[2]) || {}).name || ""}, tầng ${d[3]}`, inHospital: true, dept: d[0], gpp: "", hours: t.id === "pdg" ? "07:00–20:00 (CN đến 18:00)" : "", phone: ((d[7] || "").match(/0\d[\d ]{8,11}\d/) || [""])[0], eRx: true }));
    const sample = [{ name: "Nhà thuốc GPP mẫu A", addr: "Cần nhập địa chỉ thật", dist: 180, dir: 40, gpp: "", hours: "07:00–22:00", phone: "", eRx: true }, { name: "Nhà thuốc GPP mẫu B", addr: "Cần nhập địa chỉ thật", dist: 420, dir: 200, gpp: "", hours: "06:30–23:00", phone: "", eRx: false }, { name: "Nhà thuốc GPP mẫu C", addr: "Cần nhập địa chỉ thật", dist: 750, dir: 300, gpp: "", hours: "24/7", phone: "", eRx: true }];
    return inH.concat(sample);
}
