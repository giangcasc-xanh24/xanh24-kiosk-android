name: Build Xanh24 Kiosk APK

# Tạo 6 tệp APK (1 bản dùng chung + 5 bản riêng từng bệnh viện) mỗi khi đẩy mã lên nhánh main, hoặc bấm "Run workflow".
# Ký bản phát hành: thêm 4 Secrets trong GitHub › Settings › Secrets and variables › Actions:
#   X24_KEYSTORE_BASE64 (nội dung tệp .jks mã hóa base64), X24_KEYSTORE_PASSWORD, X24_KEY_ALIAS, X24_KEY_PASSWORD
# Không có Secrets: APK được ký bằng khóa gỡ lỗi (chỉ dùng thử – không cập nhật đè được bản đã ký khóa khác).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Giải mã khóa ký (nếu có)
        env:
          KS: ${{ secrets.X24_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/x24.jks"; echo "X24_KEYSTORE=$RUNNER_TEMP/x24.jks" >> "$GITHUB_ENV"; fi
      - name: Build 6 APK
        env:
          X24_KEYSTORE_PASSWORD: ${{ secrets.X24_KEYSTORE_PASSWORD }}
          X24_KEY_ALIAS: ${{ secrets.X24_KEY_ALIAS }}
          X24_KEY_PASSWORD: ${{ secrets.X24_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Gom APK
        run: mkdir -p out && find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \; && ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Xanh24-Kiosk-APK
          path: out/*.apk
